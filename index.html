<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNS ONE｜月間計画モック</title>
<style>
:root{--ink:#242828;--muted:#67716d;--line:#dce2dd;--red:#cf3026;--green:#14734c;--bg:#f4f5f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Noto Sans",sans-serif}header{background:#242828;color:white;padding:17px max(18px,calc((100vw - 1000px)/2));display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:2px;font-size:21px}header small{color:#c7cec8}nav{background:white;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:4px;position:sticky;top:0;z-index:2}nav button{border:0;border-radius:0;padding:13px 18px;color:var(--muted);background:none}nav button.active{border-bottom:3px solid var(--red);color:var(--red);font-weight:700}.demo{font-size:11px;text-align:center;color:#777;padding:7px 12px;background:#eceee9}main{max-width:1000px;margin:24px auto;padding:0 22px 70px}h1{font-size:25px;line-height:1.4;margin:8px 0}h2{font-size:17px;margin:0 0 15px}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:1px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:15px 0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}button,a.btn{cursor:pointer;font:inherit;font-size:14px;font-weight:600;color:var(--ink);border:1px solid #ccd4ce;background:white;border-radius:7px;padding:9px 14px;text-decoration:none;display:inline-block}button:hover{background:#f0f3ee}button.primary{background:var(--red);color:white;border-color:var(--red)}button:disabled{opacity:.4;cursor:not-allowed}.link{color:#92443c;background:none;border:0;padding:4px 0}.pill{display:inline-block;font-size:12px;font-weight:650;white-space:nowrap;padding:2px 8px;border-radius:5px;background:#ecefeb;color:#66716a}.done{color:#157246;background:#e7f3e9}.wait{color:#97600d;background:#fff1d6}.blue{color:#25679a;background:#e7f1fa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border-left:3px solid #9dab9e;padding:3px 12px}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}input:not([type=checkbox]),textarea,select{font:inherit;font-size:15px;padding:10px;border:1px solid #cdd5cf;border-radius:6px;background:white;width:100%;color:var(--ink)}textarea{min-height:95px;resize:vertical}input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);vertical-align:middle}input:focus,textarea:focus,button:focus-visible,select:focus{outline:2px solid #976359;outline-offset:2px}.field{margin-bottom:17px}.checks label{display:inline-flex;align-items:center;gap:4px;margin-right:12px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{text-align:left;font-size:12px;color:var(--muted);font-weight:500}td,th{padding:12px 8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:middle}tr:last-child td{border-bottom:0}td:first-child,th:first-child{padding-left:0}td:last-child,th:last-child{text-align:right;padding-right:0}.small{font-size:12px}td button{padding:6px 10px;font-size:12px}.crumb{font-size:12px;color:var(--muted);margin-bottom:15px}.crumb button{font-size:12px}.steps{display:flex;gap:8px;font-size:12px;margin:14px 0 20px;color:#7f8881}.steps span{border-bottom:2px solid #d9dfd9;padding:4px 0;flex:1}.steps .current{color:var(--red);border-color:var(--red);font-weight:700}.split{display:grid;grid-template-columns:2fr 1fr;gap:18px}.context{border-left:3px solid #a2b3a3;padding-left:12px;font-size:13px}.article{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.thumb{width:50px;height:50px;border-radius:8px;background:#e7e9df;display:grid;place-items:center;font-size:27px;color:#566e59}.article-title{font-weight:650}.toolbar{position:sticky;bottom:0;background:#fffef8f2;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;backdrop-filter:blur(8px)}.notice{padding:12px 15px;border-radius:7px;background:#edf3ed;border-left:3px solid #648c67;margin:12px 0;font-size:13px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#253d2c;color:white;border-radius:8px;padding:12px 18px;z-index:10;max-width:90vw;display:none;font-size:13px}footer{text-align:center;font-size:11px;color:#7d857e;padding:20px}.preview{background:#e9ece3;min-height:150px;display:grid;place-items:center;font-size:65px;border-radius:8px}.progress td:first-child{width:40%}.progress td{font-size:13px}.request{white-space:pre-wrap}.page-tip{font-size:12px;margin-top:8px;color:var(--muted)}
@media(max-width:600px){body{font-size:14px}header{padding:12px 16px}header b{font-size:18px}header small{font-size:10px}nav button{font-size:12px;padding:12px 13px}main{margin:18px auto;padding:0 14px 65px}h1{font-size:22px}.heading{align-items:flex-start;margin-bottom:12px}.card{padding:15px;margin:12px 0}.grid,.split{grid-template-columns:1fr;gap:0}.stats{gap:4px}.stat{padding:2px 9px}.stat strong{font-size:22px}td,th{padding:11px 5px}.client-table th:nth-child(1){width:34%!important}.client-table th:nth-child(3){width:20%!important}.client-table td{font-size:12px}.plan-table td{font-size:12px}.plan-table td button{padding:5px 7px}.article{gap:8px;grid-template-columns:42px 1fr auto}.thumb{width:42px;height:42px}.article button{font-size:12px;padding:7px 9px}.toolbar button{font-size:12px;padding:9px 10px}.toolbar .small{font-size:11px}.heading button{font-size:12px;padding:7px 10px}.steps{gap:6px;font-size:11px}.demo{font-size:10px}.progress td{font-size:12px}}
.checks{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.checks label{margin:0;gap:3px;font-size:12px}.grid>*{min-width:0}.grid input{min-width:0}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
</style>
<header><b>SNS ONE <small>管理</small></b><small>画面モック · v1</small></header>
<nav id="nav"></nav><div class="demo">操作確認用モック · AI生成・お客様への通知・実配信は行いません</div><main id="app"></main><div id="toast" role="status"></div><footer>架空の顧客・記事を使用しています。入力はこのブラウザにだけ保存されます。</footer>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='snsone-monthly-mock-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}
let month=db.month||'2026-11',view='clients',editId=null,dirty=false;
function model(){return db[month]||(db[month]={request:'',days:[1,3,5],time:'10:00',material:'none',plans:[]})}
function save(){db.month=month;localStorage.setItem(KEY,JSON.stringify(db))}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3200)}
function go(v,id){if(dirty&&!confirm('保存していない変更があります。変更を破棄して移動しますか？'))return;dirty=false;view=v;editId=id??null;render();scrollTo(0,0)}
const label=s=>({proposal:'提案',adopted:'採用',excluded:'除外',draft:'品質確認待ち',approved:'提出待ち',submitted:'お客様承認待ち',scheduled:'配信予定'}[s]);
const badge=s=>'<span class="pill '+(['adopted','approved','scheduled'].includes(s)?'done':s==='excluded'?'':s==='submitted'?'blue':'wait')+'">'+label(s)+'</span>';
const plans=()=>model().plans, articles=()=>plans().filter(p=>['draft','approved','submitted','scheduled'].includes(p.state));
function crumb(t){return '<div class="crumb"><button class="link" onclick="go(\'clients\')">顧客</button> / <button class="link" onclick="go(\'client\')">サンプル工房</button> / '+t+'</div>'}
function head(t,sub=''){return '<div class="heading"><div><div class="eyebrow">サンプル工房 · '+month.replace('-','年')+'月</div><h1>'+t+'</h1>'+ (sub?'<div class="muted">'+sub+'</div>':'')+'</div></div>'}
function steps(n){return '<div class="steps">'+['依頼を入力','計画案を確認','記事を制作'].map((s,i)=>'<span class="'+(i===n?'current':'')+'">'+(i+1)+'. '+s+'</span>').join('')+'</div>'}
function render(){
$('#nav').innerHTML=[['board','ボード'],['clients','顧客'],['articles','記事一覧'],['logs','配信履歴']].map(([v,l])=>'<button class="'+(view===v||v==='clients'&&['client','plan','single','proposals','editplan'].includes(view)?'active':'')+'" onclick="go(\''+v+'\')">'+l+'</button>').join('');
let h='',m=model();
if(view==='clients')h='<div class="eyebrow">CUSTOMERS</div><h1>顧客一覧</h1><div class="muted">顧客を選び、月間計画や記事へ進みます。</div><div class="card"><table class="client-table"><thead><tr><th style="width:45%">顧客名</th><th>状態</th><th>配信記事残</th><th></th></tr></thead><tbody><tr><td><b>サンプル工房</b></td><td><span class="pill done">稼働中</span></td><td>'+articles().filter(p=>p.state==='scheduled').length+'件</td><td><button onclick="go(\'client\')">詳細 →</button></td></tr></tbody></table></div><div class="page-tip">まず「詳細」から月間計画を作成できます。</div>';
if(view==='client')h=crumb('詳細')+head('サンプル工房','オリジナルグッズ制作 · 架空のデータ')+'<div class="card"><h2>次の作業</h2><div class="row"><button class="primary" onclick="go(\'plan\')">月間計画を作る →</button><button onclick="go(\'single\')">記事を1件作る →</button><button onclick="go(\'articles\')">記事一覧</button></div></div><div class="card stats"><div class="stat"><strong>'+plans().filter(p=>p.state==='proposal').length+'</strong><span>未採用の計画案</span></div><div class="stat"><strong>'+articles().filter(p=>p.state==='draft').length+'</strong><span>品質確認待ち</span></div><div class="stat"><strong>'+articles().filter(p=>p.state==='scheduled').length+'</strong><span>配信予定の記事</span></div></div><div class="card"><h2>基本情報</h2><table><tr><td>事業</td><td>オリジナルグッズ制作</td></tr><tr><td>投稿先</td><td>Instagram・Facebook・ブログ</td></tr><tr><td>投稿方針</td><td>制作の特徴や活用例を丁寧に伝える</td></tr></table></div>';

if(view==='single'){let d=m.singleDraft||{};h=crumb('記事を1件作る')+head('記事を1件作る','告知や個別の投稿を制作します。')+'<div class="card"><div class="grid"><div class="field"><label for="single-date">配信日</label><input id="single-date" type="date" value="'+esc(d.date||month+'-15')+'" oninput="dirty=true"></div><div class="field"><label for="single-time">配信時刻</label><input id="single-time" type="time" value="'+esc(d.time||m.time)+'" oninput="dirty=true"></div></div><div class="field"><label for="single-title">タイトル・テーマ <span class="muted">必須</span></label><input id="single-title" placeholder="例：新しいキーホルダーのご紹介" value="'+esc(d.title||'')+'" oninput="dirty=true"></div><div class="field"><label for="single-request">依頼内容 <span class="muted">必須</span></label><textarea id="single-request" placeholder="伝えたい特徴、対象のお客様、必ず入れたい内容など" oninput="dirty=true">'+esc(d.request||'')+'</textarea></div><div class="field"><label for="single-material">画像の用意</label><select id="single-material" onchange="dirty=true"><option value="new" '+(d.material!=='sample'?'selected':'')+'>新規画像のイメージを指定</option><option value="sample" '+(d.material==='sample'?'selected':'')+'>商品写真（サンプル）を使用</option></select></div><div class="field"><label for="single-image">画像の指示</label><textarea id="single-image" placeholder="例：白い背景で商品の形が分かる写真。文字は入れない。" oninput="dirty=true">'+esc(d.image||'')+'</textarea></div><div class="row"><button onclick="saveSingle()">下書き保存</button><button class="primary" onclick="createSingle()">この記事を制作 →</button></div><p class="page-tip">制作後は記事一覧で確認・承認します。実際のAI生成は行いません。</p></div>'}

if(view==='plan')h=crumb('月間計画')+head('月間計画を作る')+steps(0)+'<div class="split"><div class="card"><div class="grid"><div class="field"><label for="month">対象月</label><input id="month" type="month" value="'+month+'" onchange="changeMonth(this.value)"></div><div class="field"><label for="time">配信時刻</label><input id="time" type="time" value="'+esc(m.time)+'" oninput="dirty=true"></div></div><div class="field"><label>配信曜日</label><div class="checks">'+['日','月','火','水','木','金','土'].map((d,i)=>'<label><input type="checkbox" name="day" value="'+i+'" '+(m.days.includes(i)?'checked':'')+' onchange="dirty=true">'+d+'</label>').join('')+'</div></div><div class="field"><label for="request">今月の依頼・要望</label><textarea id="request" placeholder="例：今月はチーム向けキーホルダーを中心に。制作工程や贈り物としての使い方も紹介したい。" oninput="dirty=true">'+esc(m.request)+'</textarea></div><div class="field"><label for="material">使用したい素材</label><select id="material" onchange="dirty=true"><option value="none" '+(m.material==='none'?'selected':'')+'>素材を指定しない</option><option value="sample" '+(m.material==='sample'?'selected':'')+'>商品写真（サンプル）</option></select></div><div class="row"><button onclick="saveForm()">下書き保存</button><button class="primary" onclick="generate()">計画案を作成 →</button></div>'+(plans().length?'<p class="page-tip">この月は '+plans().length+'件の計画があります。<button class="link" onclick="go(\'proposals\')">計画案を確認</button></p>':'')+'</div><aside class="card"><h2>提案に使う情報</h2><div class="context"><b>顧客情報・投稿方針</b><p>事業の特徴と、伝えたい価値</p><b>過去の記事</b><p>内容の重複を避けるための参照</p><b>今回の依頼</b><p>入力した要望と選択した素材</p></div><p class="page-tip">このモックの提案は固定サンプルです。入力は後の制作画面へ引き継ぎます。</p></aside></div>';
if(view==='proposals')h=crumb('計画案')+head('計画案を確認','タイトル・狙い・画像案を確認して採用します。')+steps(1)+'<div class="row between"><button onclick="go(\'plan\')">← 依頼を確認</button><span class="muted">'+plans().length+'件</span></div><div class="card"><table class="plan-table"><thead><tr><th style="width:26px"><input type="checkbox" aria-label="未制作の計画をすべて選択" '+(plans().some(p=>p.selected)&&plans().filter(p=>['proposal','adopted'].includes(p.state)).every(p=>p.selected)?'checked':'')+' onchange="selectAll(this.checked)"></th><th style="width:48px">日付</th><th>タイトル案</th><th style="width:55px">状態</th><th style="width:46px"></th></tr></thead><tbody>'+plans().map(p=>'<tr><td><input type="checkbox" aria-label="'+esc(p.date+'の計画を選択')+'" '+(p.selected?'checked':'')+' '+(['proposal','adopted'].includes(p.state)?'':'disabled')+' onchange="choose('+p.id+',this.checked)"></td><td>'+p.date.slice(5).replace('-','/')+'</td><td>'+esc(p.title)+'</td><td>'+badge(p.state)+'</td><td><button onclick="go(\'editplan\','+p.id+')">確認</button></td></tr>').join('')+'</tbody></table></div><div class="toolbar"><span id="selection" class="small">'+plans().filter(p=>p.selected).length+'件選択</span><div class="row"><button onclick="batch(\'excluded\')">除外</button><button onclick="batch(\'adopted\')">採用</button><button class="primary" onclick="produce()">制作を開始</button></div></div>';
if(view==='editplan'){let p=plans().find(p=>p.id===editId);h=crumb('計画の確認')+head('計画の確認・修正',p.date+' '+(p.time||m.time))+'<div class="card"><div class="field"><label for="ptitle">タイトル案</label><input id="ptitle" value="'+esc(p.title)+'" oninput="dirty=true"></div><div class="field"><label for="aim">狙い</label><textarea id="aim" oninput="dirty=true">'+esc(p.aim)+'</textarea></div><div class="field"><label for="image">画像の指示</label><textarea id="image" oninput="dirty=true">'+esc(p.image)+'</textarea></div><div class="row"><button onclick="go(\'proposals\')">一覧へ戻る</button><button class="primary" '+(['proposal','adopted','excluded'].includes(p.state)?'':'disabled')+' onclick="savePlan()">保存して採用</button></div></div><div class="card"><h2>引き継ぐ依頼</h2><div class="request">'+esc(p.request||'指定なし')+'</div></div>'}
if(view==='articles')h=head('記事一覧','制作後の記事を確認・承認します。')+'<div class="row between"><button onclick="go(\'plan\')">月間計画</button><label>対象月 <input aria-label="記事の対象月" type="month" value="'+month+'" onchange="changeMonth(this.value,\'articles\')"></label></div><div class="card">'+(articles().length?articles().map(p=>'<div class="article"><div class="thumb">◇</div><div><div class="article-title">'+esc(p.title)+'</div><div class="small">'+p.date+' '+(p.time||m.time)+'　'+badge(p.state)+'</div></div><button onclick="go(\'article\','+p.id+')">'+(p.state==='draft'?'確認・承認':p.state==='approved'?'提出へ':'詳細')+'</button></div>').join(''):'<h2>制作済みの記事はありません</h2><p class="muted">月間計画で案を採用し、制作を開始してください。</p>')+'</div>';
if(view==='article'){let p=plans().find(p=>p.id===editId), rank=['draft','approved','submitted','scheduled'].indexOf(p.state);h=crumb('記事詳細')+head(p.title)+badge(p.state)+'<div class="card"><table class="progress"><thead><tr><th>工程</th><th>状態</th><th>日時</th></tr></thead><tbody>'+['記事制作','品質承認','お客様へ提出','お客様承認'].map((t,i)=>'<tr><td>'+t+'</td><td><span class="pill '+(rank>=i?'done':rank+1===i?'wait':'')+'">'+(rank>=i?'完了':rank+1===i?'次の操作':'未着手')+'</span></td><td>'+esc(p.times?.[i]||'—')+'</td></tr>').join('')+'</tbody></table></div><div class="notice">'+(['本文・画像を確認し、品質承認へ進んでください。','品質承認済みです。次はお客様への提出です。','お客様へ提出済みの表示例です。承認を待っています。','配信予定の表示例です。実際の配信は行いません。'][rank])+'</div><div class="card"><div class="preview" aria-label="商品画像のサンプル">◇</div><p class="page-tip">画像は配置確認用の図です。</p><label for="body">投稿本文（サンプル）</label><textarea id="body" style="min-height:140px" '+(rank===0?'oninput="dirty=true"':'readonly')+'>'+esc(p.body)+'</textarea><div class="row" style="margin-top:14px">'+(rank===0?'<button onclick="saveBody()">本文を保存</button><button class="primary" onclick="advance(\'approved\')">品質承認</button>':rank===1?'<button class="primary" onclick="advance(\'submitted\')">お客様へ提出</button>':rank===2?'<button onclick="advance(\'scheduled\')">お客様承認後の表示を見る</button>':'')+'<button onclick="go(\'articles\')">記事一覧へ</button></div></div><div class="card"><h2>制作に引き継いだ依頼</h2><p class="request">'+esc(p.request||'指定なし')+'</p><p class="muted">画像の指示：'+esc(p.image)+'</p></div>'}
if(view==='board')h='<div class="eyebrow">OVERVIEW</div><h1>ボード</h1><div class="card"><h2>今対応が必要なこと</h2><table><tr><td>サンプル工房</td><td>'+articles().filter(p=>p.state==='draft').length+'件 品質確認待ち</td><td><button onclick="go(\'articles\')">記事へ</button></td></tr><tr><td>月間計画</td><td>'+plans().filter(p=>p.state==='proposal').length+'件 未採用</td><td><button onclick="go(\'plan\')">計画へ</button></td></tr></table></div>';
if(view==='logs')h='<div class="eyebrow">DELIVERIES</div><h1>配信履歴</h1><div class="card"><h2>実配信は行っていません</h2><p class="muted">このモックは、計画作成からお客様への提出までの操作確認用です。</p><button onclick="go(\'articles\')">記事一覧へ</button></div>';
$('#app').innerHTML=h;
}
function changeMonth(v,next='plan'){if(!/^\d{4}-\d{2}$/.test(v))return;if(dirty&&!confirm('未保存の入力を破棄して月を変更しますか？')){render();return}month=v;dirty=false;save();go(next)}
function capture(){const days=[...document.querySelectorAll('[name=day]:checked')].map(e=>+e.value);if(!days.length){toast('配信曜日を1つ以上選んでください');return false}if(!$('#time').value){toast('配信時刻を入力してください');return false}Object.assign(model(),{request:$('#request').value,days,time:$('#time').value,material:$('#material').value});save();dirty=false;return true}
function saveForm(){if(capture())toast('このブラウザに下書きを保存しました')}
const topics=['チームでそろえる、オリジナルキーホルダー','デザインが形になるまでの制作工程','贈り物に気持ちを添えるアイデア','毎日持ち歩きたくなるグッズの使い方','素材の表情を楽しむオリジナル制作','ロゴを生かしたデザインの工夫','イベントの記念に残るものづくり','ご相談から完成までの流れ','色と形で個性を伝える','小さなアイテムでチームの一体感を','写真を使った記念品のアイデア','大切に使うためのお手入れ方法','次の季節に向けたグッズづくり'];
function generate(){if(!capture())return;let m=model();if(m.plans.some(p=>!p.single)){toast('保存済みの計画案を開きました。重複作成はしません');go('proposals');return}let [y,mo]=month.split('-').map(Number),n=new Date(y,mo,0).getDate(),i=0;for(let d=1;d<=n;d++){if(!m.days.includes(new Date(y,mo-1,d).getDay()))continue;let date=month+'-'+String(d).padStart(2,'0');if(m.plans.some(p=>p.date===date))continue;m.plans.push({id:d,date,title:topics[i++%topics.length],aim:'制作の特徴と活用方法を具体的に紹介し、ご相談のきっかけを作る。',image:m.material==='sample'?'指定した商品写真を中心に、形や質感が伝わる構成。':'商品の形と質感が分かる、シンプルな背景のイメージ。',request:m.request,state:'proposal',selected:false,times:[]})}save();go('proposals');toast('サンプルの計画案を作成しました（API利用なし）')}
function choose(id,b){plans().find(p=>p.id===id).selected=b;save();$('#selection').textContent=plans().filter(p=>p.selected).length+'件選択'}
function selectAll(b){plans().forEach(p=>p.selected=['proposal','adopted'].includes(p.state)?b:false);save();render()}
function batch(s){let a=plans().filter(p=>p.selected&&['proposal','adopted'].includes(p.state));if(!a.length)return toast('計画案を選択してください');a.forEach(p=>{p.state=s;if(s==='excluded')p.selected=false});save();render();toast(a.length+'件を'+label(s)+'しました')}
function savePlan(){let p=plans().find(p=>p.id===editId);if(!$('#ptitle').value.trim())return toast('タイトル案を入力してください');Object.assign(p,{title:$('#ptitle').value,aim:$('#aim').value,image:$('#image').value,state:'adopted'});dirty=false;save();go('proposals');toast('修正内容を保存し、採用しました')}
function stamp(){return new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function mSafeTime(){return model().time}
function produce(){let a=plans().filter(p=>p.selected);if(!a.length)return toast('採用した計画を選択してください');if(a.some(p=>p.state!=='adopted'))return toast('選択中の計画を先に「採用」してください');a.forEach(p=>{p.state='draft';p.selected=false;p.times=[stamp()];p.time=mSafeTime();p.body=p.title+'\n\nオリジナルグッズを通じて、日々の活動や大切な思い出を形に。素材やデザインを考える時間も、ものづくりの楽しさのひとつです。\n\nご希望のイメージをお気軽にご相談ください。\n\n※操作確認用のサンプル本文です。'});save();go('articles');toast(a.length+'件の制作後の状態を表示しました')}
function saveBody(){plans().find(p=>p.id===editId).body=$('#body').value;dirty=false;save();toast('本文を保存しました')}
function advance(s){if(dirty)return toast('変更した本文を先に保存してください');let p=plans().find(p=>p.id===editId);p.state=s;p.times[['draft','approved','submitted','scheduled'].indexOf(s)]=stamp();save();render();toast(s==='submitted'?'提出済みの表示に切り替えました。通知は送信していません':'状態を更新しました（モック）')}

function singleValues(){return {date:$('#single-date').value,time:$('#single-time').value,title:$('#single-title').value.trim(),request:$('#single-request').value.trim(),material:$('#single-material').value,image:$('#single-image').value.trim()}}
function saveSingle(){model().singleDraft=singleValues();save();dirty=false;toast('1件分の下書きを保存しました')}
function createSingle(){
 const d=singleValues();
 if(!d.date||!d.time)return toast('配信日と時刻を入力してください');
 if(!d.title||!d.request)return toast('タイトル・テーマと依頼内容を入力してください');
 const previousMonth=month,old=model(),target=d.date.slice(0,7);
 if(target!==month&&!confirm('配信日に合わせて'+target+'の記事一覧へ進みます。よろしいですか？'))return;
 month=target;const m=model();
 if(m.plans.some(p=>p.date===d.date)){month=previousMonth;return toast('この配信日には既に記事・計画があります。別の日を選んでください');}
 const id=Date.now();m.plans.push({...d,id,single:true,aim:d.request,state:'draft',selected:false,times:[stamp()],body:d.title+'\n\n'+d.request+'\n\n※操作確認用の仮本文です。実際のAI生成は行っていません。',image:d.image||(d.material==='sample'?'指定した商品写真を使用':'画像の指示なし')});
 delete old.singleDraft;dirty=false;save();go('article',id);toast('1件の記事を作成しました（モック）');
}

render();
</script></html>
